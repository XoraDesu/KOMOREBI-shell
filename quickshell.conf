# KOMOREBI QuickShell Configuration
# ─────────────────────────────────────────────────────────────────────────────
# This file is read by QuickShell at startup.
# See: https://quickshell.outfoxxed.me/docs/configuration/

[quickshell]
# Entry point
shell = "shell.qml"

# QML import paths — lets any QML file find our modules and theme
# without needing relative ../.. paths
qmlImportPaths = [
  ".",           # project root (for shell.qml → ShellRoot)
  "theme",       # KOMOREBI.Theme singleton
  "services",    # KOMOREBI.Services singleton
  "modules/bar",     # KOMOREBI.Bar components
  "modules/desktop", # KOMOREBI.Desktop components
  "modules/dock",     # KOMOREBI.Dock components
  "modules/launcher", # KOMOREBI.Launcher components
]

